org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Lint's K2 UAST backend in AGP 8.7.3 is built against a different Kotlin analysis
# API than the Compose and lifecycle lint checks, which crashes lint with
# IncompatibleClassChangeError. The older UAST backend analyses the same code
# without the mismatch. Remove when the project moves to a newer AGP.
android.lint.useK2Uast=false
